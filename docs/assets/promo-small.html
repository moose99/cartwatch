<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  .tile {
    width: 440px; height: 280px;
    background: linear-gradient(135deg, #1a2530 0%, #232f3e 60%, #2d3f52 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    text-align: center;
  }
  .tile::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,153,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,153,0,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,153,0,0.1); }
  .ring1 { width: 320px; height: 320px; top: -130px; right: -90px; }
  .glow { position:absolute; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(255,153,0,0.1) 0%, transparent 65%); top:50%; left:50%; transform:translate(-50%,-50%); }
  .logo { position: relative; filter: drop-shadow(0 0 16px rgba(255,153,0,0.4)); margin-bottom: 16px; }
  .brand { position: relative; font-size: 40px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
  .brand span { color: #FF9900; }
  .tag { position: relative; font-size: 15px; color: rgba(255,255,255,0.55); margin-top: 8px; }
</style>
</head>
<body>
<div class="tile">
  <div class="ring ring1"></div>
  <div class="glow"></div>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="80" height="80">
    <rect x="1" y="1" width="46" height="46" rx="10" fill="#37475a"/>
    <rect x="21" y="24" width="17" height="6" rx="2" fill="#FF9900"/>
    <path d="M6 14 L17 14 L22 30 L37 30 L40 18 L20 18" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="36" r="3" fill="none" stroke="white" stroke-width="2.5"/>
    <circle cx="35" cy="36" r="3" fill="none" stroke="white" stroke-width="2.5"/>
  </svg>
  <div class="brand">Cart<span>Watch</span></div>
  <div class="tag">Track your Amazon spending</div>
</div>
</body>
</html>
