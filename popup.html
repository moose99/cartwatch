<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartWatch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22">
      <rect x="1" y="1" width="46" height="46" rx="8" fill="#37475a"/>
      <rect x="21" y="24" width="17" height="6" rx="2" fill="#FF9900"/>
      <path d="M6 14 L17 14 L22 30 L37 30 L40 18 L20 18"
            fill="none" stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="25" cy="36" r="3" fill="none" stroke="white" stroke-width="2.5"/>
      <circle cx="35" cy="36" r="3" fill="none" stroke="white" stroke-width="2.5"/>
    </svg>
    <span class="title">CartWatch</span>
  </div>

  <div class="month-nav">
    <button id="prev-month" class="nav-btn" title="Previous month">&#8249;</button>
    <span id="month-label" class="month-label"></span>
    <button id="next-month" class="nav-btn" title="Next month">&#8250;</button>
  </div>

  <div class="budget-section">
    <div class="budget-row">
      <span class="label">Monthly budget</span>
      <div class="budget-input-wrap">
        <span class="currency">$</span>
        <input type="number" id="budget-input" min="0" step="10" placeholder="0">
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>

    <div class="amounts-row">
      <div class="amount-block">
        <span class="amount-value" id="spent-amount">$0.00</span>
        <span class="amount-label">spent</span>
      </div>
      <div class="amount-block right">
        <span class="amount-value" id="remaining-amount">--</span>
        <span class="amount-label" id="remaining-label">remaining</span>
      </div>
    </div>
  </div>

  <div class="orders-section">
    <div class="orders-header">
      <span class="label">Orders this month</span>
      <span id="order-count" class="order-count"></span>
    </div>
    <div class="filter-row" id="filter-row" style="display:none">
      <select id="card-filter" class="card-filter">
        <option value="">All payment methods</option>
      </select>
    </div>
    <ul id="orders-list" class="orders-list"></ul>
  </div>

  <div class="footer">
    <button id="scan-btn" class="scan-btn">Scan Orders</button>
    <div id="scan-bar-wrap" class="scan-bar-wrap" style="display:none">
      <div class="scan-bar">
        <div class="scan-bar-fill" id="scan-bar-fill"></div>
      </div>
    </div>
    <div id="scan-progress" class="scan-progress" style="display:none"></div>
    <div id="last-scan" class="last-scan"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
